<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account | AEPX TECH</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f3f6fc;
        color: #172033;
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 30px;
        background: white;
        border-radius: 18px;
        box-shadow: 0 12px 40px #15284a18;
      }
      h1 {
        margin: 0 0 8px;
        color: #1260ed;
      }
      p {
        line-height: 1.5;
        color: #667085;
      }
      label {
        display: block;
        margin: 16px 0 7px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #d5dbea;
        border-radius: 9px;
        font-size: 16px;
      }
      button {
        cursor: pointer;
        border: 0;
        border-radius: 9px;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 600;
      }
      .primary {
        width: 100%;
        margin-top: 20px;
        background: #1761ed;
        color: white;
      }
      .switch {
        background: #edf3ff;
        color: #1455c8;
      }
      .switches {
        display: flex;
        gap: 10px;
        margin: 22px 0;
      }
      .switches button {
        flex: 1;
      }
      #message {
        overflow-wrap: anywhere;
      }
      a {
        color: #1455c8;
      }
      .back {
        display: inline-block;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>AEPX TECH</h1>
      <p id="intro">Sign in to access your account, addresses and orders.</p>

      <div class="switches">
        <button class="switch" id="loginTab" type="button">Log in</button>
        <button class="switch" id="signupTab" type="button">Sign up</button>
      </div>

      <form id="accountForm">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          minlength="8"
          required
        />

        <div id="confirmWrap" hidden>
          <label for="confirmPassword">Confirm password</label>
          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
          />
        </div>

        <button class="primary" id="submitButton" type="submit">Log in</button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
      <button id="logoutButton" class="switch" type="button" hidden>
        Log out
      </button>
      <p><a class="back" href="./index.html">← Back to store</a></p>
    </main>

    <script type="module" src="./js/supabase.js"></script>
    <script type="module">
      const client = window.aepxSupabase;

      const form = document.getElementById("accountForm");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirmPassword");
      const confirmWrap = document.getElementById("confirmWrap");
      const submitButton = document.getElementById("submitButton");
      const message = document.getElementById("message");
      const intro = document.getElementById("intro");
      const logoutButton = document.getElementById("logoutButton");

      let mode = "login";

      function setMessage(text) {
        message.textContent = text;
      }

      function setMode(nextMode) {
        mode = nextMode;
        const signup = mode === "signup";
        confirmWrap.hidden = !signup;
        confirmPassword.required = signup;
        submitButton.textContent = signup ? "Create account" : "Log in";
        password.autocomplete = signup ? "new-password" : "current-password";
        intro.textContent = signup
          ? "Create an account to manage your addresses and orders."
          : "Sign in to access your account, addresses and orders.";
        setMessage("");
      }

      document
        .getElementById("loginTab")
        .addEventListener("click", () => setMode("login"));
      document
        .getElementById("signupTab")
        .addEventListener("click", () => setMode("signup"));

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!client) {
          setMessage("Supabase did not load. Refresh and try again.");
          return;
        }

        const userEmail = email.value.trim();
        const userPassword = password.value;

        if (mode === "signup" && userPassword !== confirmPassword.value) {
          setMessage("Passwords do not match.");
          return;
        }

        submitButton.disabled = true;
        setMessage("Please wait...");

        try {
          if (mode === "signup") {
            const { data, error } = await client.auth.signUp({
              email: userEmail,
              password: userPassword,
              options: { emailRedirectTo: window.location.origin },
            });
            if (error) throw error;

            setMessage(
              data.session
                ? "Account created! You are signed in."
                : "Account created if permitted. Check your email for a confirmation link.",
            );
          } else {
            const { error } = await client.auth.signInWithPassword({
              email: userEmail,
              password: userPassword,
            });
            if (error) throw error;
            setMessage("Login successful!");
          }
        } catch (error) {
          setMessage(error.message || "Something went wrong.");
        } finally {
          submitButton.disabled = false;
          await updateSession();
        }
      });

      async function updateSession() {
        if (!client) {
          setMessage("Supabase did not load. Check the browser console.");
          return;
        }
        const { data, error } = await client.auth.getSession();
        if (error) {
          setMessage(error.message);
          return;
        }

        const signedIn = !!data.session;
        logoutButton.hidden = !signedIn;
        if (signedIn) {
          intro.textContent = "Signed in as " + data.session.user.email;
        }
      }

      logoutButton.addEventListener("click", async () => {
        const { error } = await client.auth.signOut();
        setMessage(error ? error.message : "You have logged out.");
        setMode("login");
        await updateSession();
      });

      if (client) {
        client.auth.onAuthStateChange(() => updateSession());
        await updateSession();
      } else {
        setMessage(
          "Supabase client missing. Check js/supabase.js and the Console.",
        );
      }
    </script>
  </body>
</html>
